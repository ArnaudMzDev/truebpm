<svg width="1284" height="2778" viewBox="0 0 1284 2778" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1284" y2="2778" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050506"/>
      <stop offset="0.55" stop-color="#08090D"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A462FF"/>
