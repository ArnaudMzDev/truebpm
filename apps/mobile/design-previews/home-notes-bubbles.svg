    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .h1 { fill:#F7F4FF; font-size:58px; font-weight:950; letter-spacing:-1.5px; }
      .tab { fill:#F7F4FF; font-size:25px; font-weight:900; }
      .muted { fill:#8F94A3; font-size:25px; font-weight:800; }
      .tiny { fill:#818696; font-size:19px; font-weight:800; }
      .purple { fill:#A462FF; }
      .cardTitle { fill:#F7F4FF; font-size:42px; font-weight:950; letter-spacing:-0.9px; }
      .body { fill:#D5D7E2; font-size:31px; font-weight:850; }
      .label { fill:#A462FF; font-size:22px; font-weight:950; letter-spacing:5px; }
    </style>
  </defs>

  <rect width="1284" height="2778" fill="url(#bg)"/>
